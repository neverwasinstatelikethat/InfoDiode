[project]
name = "infodiode-backend"
version = "0.1.0"
description = "InfoDiode — air-gapped data extraction from SCADA video via OCR"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "opencv-python-headless>=4.11.0",
    "numpy>=2.1.0",
    "openpyxl>=3.1.0",
    "chardet>=5.2.0",
    "python-gnupg>=0.5.4",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "qrcode[pil]>=8.0",
    "msgpack>=1.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "websockets>=14.0",
    "jinja2>=3.1.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "Pillow>=10.0.0",
    "httpx>=0.27",
    "huggingface-hub>=0.20",
    "llama-cpp-python>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
